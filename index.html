}

[PROGRAM]
Title: 5. Fibonacci & Factorial (Recursive & Non-Recursive)
Category: Recursion & Loops
Code:
import java.util.Scanner;

public class Main {

    // Recursive Factorial Function
    static long factorialRecursive(int n) {
        if (n <= 1) {
            return 1;
        }
        return n * factorialRecursive(n - 1);
    }

    // Non-Recursive (Iterative) Factorial Function
    static long factorialNonRecursive(int n) {
        long fact = 1;
        for (int i = 1; i <= n; i++) {
            fact = fact * i;
        }
        return fact;
    }

    // Recursive Fibonacci Function (returns nth term)
    static int fibonacciRecursive(int n) {
        if (n == 0) return 0;
        if (n == 1) return 1;
        return fibonacciRecursive(n - 1) + fibonacciRecursive(n - 2);
    }

    // Non-Recursive (Iterative) Fibonacci Function
    static void fibonacciNonRecursive(int terms) {
        int t1 = 0, t2 = 1;
        for (int i = 1; i <= terms; i++) {
            System.out.print(t1 + " ");
            int next = t1 + t2;
            t1 = t2;
            t2 = next;
        }
        System.out.println();
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        System.out.println("=== Fibonacci & Factorial (Recursive & Non-Recursive) ===");
        System.out.print("Enter a non-negative integer for Factorial: ");
        int num = sc.nextInt();

        System.out.println("Factorial (Non-Recursive) of " + num + " = " + factorialNonRecursive(num));
        System.out.println("Factorial (Recursive) of " + num + "     = " + factorialRecursive(num));

        System.out.print("\nEnter number of terms for Fibonacci Series: ");
        int terms = sc.nextInt();

        System.out.print("Fibonacci Series (Non-Recursive) : ");
        fibonacciNonRecursive(terms);

        System.out.print("Fibonacci Series (Recursive)     : ");
        for (int i = 0; i < terms; i++) {
            System.out.print(fibonacciRecursive(i) + " ");
        }
        System.out.println();
    }
}

Title: 6. Multiply Two Given Matrices
Category: Arrays & Matrices
Code:
import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        System.out.println("=== Matrix Multiplication ===");
        System.out.print("Enter rows and columns of Matrix 1 (e.g., 2 2): ");
        int r1 = sc.nextInt();
        int c1 = sc.nextInt();

        System.out.print("Enter rows and columns of Matrix 2 (e.g., 2 2): ");
        int r2 = sc.nextInt();
        int c2 = sc.nextInt();

        if (c1 != r2) {
            System.out.println("Error! Columns of Matrix 1 must equal Rows of Matrix 2.");
            return;
        }

        int[][] mat1 = new int[r1][c1];
        int[][] mat2 = new int[r2][c2];
        int[][] prod = new int[r1][c2];

        System.out.println("Enter elements of Matrix 1 (" + r1 + "x" + c1 + "):");
        for (int i = 0; i < r1; i++) {
            for (int j = 0; j < c1; j++) {
                mat1[i][j] = sc.nextInt();
            }
        }

        System.out.println("Enter elements of Matrix 2 (" + r2 + "x" + c2 + "):");
        for (int i = 0; i < r2; i++) {
            for (int j = 0; j < c2; j++) {
                mat2[i][j] = sc.nextInt();
            }
        }

        // Multiply the two matrices
        for (int i = 0; i < r1; i++) {
            for (int j = 0; j < c2; j++) {
                prod[i][j] = 0;
                for (int k = 0; k < c1; k++) {
                    prod[i][j] += mat1[i][k] * mat2[k][j];
                }
            }
        }

        System.out.println("\nProduct of the Two Matrices (" + r1 + "x" + c2 + "):");
        for (int i = 0; i < r1; i++) {
            for (int j = 0; j < c2; j++) {
                System.out.print(prod[i][j] + "\t");
            }
            System.out.println();
        }
    }
}

Title: 7. Sort a Given List of Names in Ascending Order
Category: Strings & Sorting
Code:
import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        System.out.println("=== Sort List of Names in Ascending Order ===");
        System.out.print("Enter number of names: ");
        int n = sc.nextInt();
        sc.nextLine(); // Consume newline

        String[] names = new String[n];
        for (int i = 0; i < n; i++) {
            System.out.print("Enter name " + (i + 1) + ": ");
            names[i] = sc.nextLine().trim();
        }

        // Sorting names alphabetically in ascending order
        for (int i = 0; i < n - 1; i++) {
            for (int j = i + 1; j < n; j++) {
                if (names[i].compareToIgnoreCase(names[j]) > 0) {
                    String temp = names[i];
                    names[i] = names[j];
                    names[j] = temp;
                }
            }
        }

        System.out.println("\n--- Sorted Names in Ascending Order ---");
        for (int i = 0; i < n; i++) {
            System.out.println((i + 1) + ". " + names[i]);
        }
    }
}

Title: 8. Check Whether a String is a Palindrome (Ex: MADAM)
Category: Strings & Sorting
Code:
import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        System.out.println("=== String Palindrome Checker ===");
        System.out.print("Enter a string (Ex: MADAM): ");
        String str = sc.nextLine().trim();

        String reverseStr = "";
        for (int i = str.length() - 1; i >= 0; i--) {
            reverseStr = reverseStr + str.charAt(i);
        }

        System.out.println("Entered String  : " + str);
        System.out.println("Reversed String : " + reverseStr);

        if (str.equalsIgnoreCase(reverseStr)) {
            System.out.println("Result          : " + str + " is a palindrome.");
        } else {
            System.out.println("Result          : " + str + " is NOT a palindrome.");
        }
    }
}

import java.util.Scanner;

class AddSub {
    double a;
    double b;

    AddSub(double a, double b) {
        this.a = a;
        this.b = b;
    }

    double add() {
        return a + b;
    }

    double subtract() {
        return a - b;
    }
}

class MulDiv extends AddSub {

    MulDiv(double a, double b) {
        super(a, b);
    }

    double multiply() {
        return a * b;
    }

    double divide() {
        return a / b;
    }
}

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        System.out.println("=== Mathematical Operations Using Inheritance ===");
        System.out.print("Enter first number: ");
        double n1 = sc.nextDouble();

        System.out.print("Enter second number: ");
        double n2 = sc.nextDouble();

        MulDiv obj = new MulDiv(n1, n2);

        System.out.println("\n--- Results ---");
        System.out.println("Addition       : " + obj.add());
        System.out.println("Subtraction    : " + obj.subtract());
        System.out.println("Multiplication : " + obj.multiply());
        if (n2 != 0) {
            System.out.println("Division       : " + obj.divide());
        } else {
            System.out.println("Division       : Cannot divide by zero!");
        }
    }
}

import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        System.out.print("Enter number of lines of text: ");
        int numLines = sc.nextInt();
        sc.nextLine(); // Consume newline

        int charCount = 0;
        int wordCount = 0;
        int lineCount = numLines;

        for (int i = 1; i <= numLines; i++) {
            System.out.print("Enter line " + i + ": ");
            String line = sc.nextLine();

            charCount += line.length();

            String trimmed = line.trim();
            if (!trimmed.isEmpty()) {
                String[] words = trimmed.split("\\s+");
                wordCount += words.length;
            }
        }

        System.out.println("\n--- Text Analysis Result ---");
        System.out.println("Number of Characters : " + charCount);
        System.out.println("Number of Words      : " + wordCount);
        System.out.println("Number of Lines      : " + lineCount);
    }
}

Title: 13. Shape & Circle Subclass (Override getPerimeter & getArea)
Category: OOP & Inheritance
Code:
import java.util.Scanner;

class Shape {
    double getPerimeter() {
        return 0.0;
    }

    double getArea() {
        return 0.0;
    }
}

class Circle extends Shape {
    double radius;

    Circle(double radius) {
        this.radius = radius;
    }

    @Override
    double getPerimeter() {
        return 2 * Math.PI * radius;
    }

    @Override
    double getArea() {
        return Math.PI * radius * radius;
    }
}

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        System.out.println("=== Circle Area & Perimeter (Method Overriding) ===");
        System.out.print("Enter radius of the circle: ");
        double r = sc.nextDouble();

        Circle circle = new Circle(r);

        System.out.printf("Radius of Circle    : %.2f\n", r);
        System.out.printf("Perimeter of Circle : %.2f\n", circle.getPerimeter());
        System.out.printf("Area of Circle      : %.2f\n", circle.getArea());
    }
}

class Employee {
    String name;
    double basicSalary;

    Employee(String name, double basicSalary) {
        this.name = name;
        this.basicSalary = basicSalary;
    }

    double calculateSalary() {
        return basicSalary;
    }
}

class Manager extends Employee {
    double allowance;

    Manager(String name, double basicSalary, double allowance) {
        super(name, basicSalary);
        this.allowance = allowance;
    }

    @Override
    double calculateSalary() {
        return basicSalary + allowance;
    }
}

class Programmer extends Employee {
    double projectBonus;

    Programmer(String name, double basicSalary, double projectBonus) {
        super(name, basicSalary);
        this.projectBonus = projectBonus;
    }

    @Override
    double calculateSalary() {
        return basicSalary + projectBonus;
    }
}

public class Main {
    public static void main(String[] args) {
        System.out.println("=== Employee Salary Calculation (Method Overriding) ===\n");

        Manager manager = new Manager("Anil Mohanty", 55000.0, 12000.0);
        Programmer programmer = new Programmer("Sneha Das", 42000.0, 8000.0);

        System.out.println("Role         : Manager");
        System.out.println("Name         : " + manager.name);
        System.out.println("Total Salary : Rs. " + manager.calculateSalary());

        System.out.println("-----------------------------------------");

        System.out.println("Role         : Programmer");
        System.out.println("Name         : " + programmer.name);

import java.util.Scanner;

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        System.out.println("=== Divide by Zero Exception Handling ===");
        System.out.print("Enter first number (numerator): ");
        int a = sc.nextInt();

        System.out.print("Enter second number (denominator, try 0): ");
        int b = sc.nextInt();

        try {
            int result = a / b;

        } catch (ArithmeticException e) {
            System.out.println("\nException Caught: Division by zero is not allowed!");
            System.out.println("Exception Details: " + e);
        } finally {
            System.out.println("Finally Block: Program execution finished.");
        }
    }
}

import java.util.Scanner;

class DuplicateValueException extends Exception {
    DuplicateValueException(String message) {
        super(message);
    }
}

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        System.out.println("=== Duplicate Integer Exception Demo ===");
        System.out.print("How many integers do you want to read? ");
        int n = sc.nextInt();

        int[] arr = new int[n];

        try {
            for (int i = 0; i < n; i++) {
                System.out.print("Enter integer " + (i + 1) + ": ");
                int val = sc.nextInt();

                for (int j = 0; j < i; j++) {
                    if (arr[j] == val) {
                        throw new DuplicateValueException("Duplicate number detected: " + val);
                    }
                }
                arr[i] = val;
            }

            System.out.print("\nAll integers are unique: ");
            for (int i = 0; i < n; i++) {
                System.out.print(arr[i] + " ");
            }
            System.out.println();

        } catch (DuplicateValueException e) {
            System.out.println("\nException Caught -> " + e.getMessage());
        }
    }
}

import java.util.Scanner;

class UnderAge extends Exception {
    int age;

    UnderAge(int age) {
        this.age = age;
    }

    @Override
    public String toString() {
        return "Under Age: " + age;
    }
}

public class exceptionDemo {

    static void test(int age) throws UnderAge {
        if (age < 18) {
            throw new UnderAge(age);
        } else {
            System.out.println("Valid Age (" + age + "). Access Granted!");
        }
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        System.out.println("=== UnderAge Custom Exception Demo ===");
        System.out.print("Enter age to test: ");
        int age = sc.nextInt();

        try {
            test(age);
        } catch (UnderAge e) {
            System.out.println(e);
        }
    }
}
